<text x="623.8677327141012" y="136.06" fill="#a0a0a0" font-size="10" font-weight="400" text-anchor="start" >n=963</text>
<circle cx="641.4" cy="108.6" r="17.6" fill="#199e70" fill-opacity="0.85" stroke="#141414"/>
<text x="662.9505534942303" y="112.57" fill="#a0a0a0" font-size="10" font-weight="400" text-anchor="start" >n=607</text>
<text x="102.0" y="284.6" fill="#199e70" font-size="11" font-weight="400" text-anchor="start" >predicted 0.05, actual 0.00 (n=39) — the reject tail is honest</text>
<text x="371.6" y="295.27" fill="#d95926" font-size="11" font-weight="400" text-anchor="start" >0.45 → 0.24: says maybe, means no</text>
<text x="684.0" y="322.3" fill="#d95926" font-size="11" font-weight="400" text-anchor="end" >0.92 → 0.87: mostly right, but that 13% is 80 scripts</text>
<text x="390.0" y="400" fill="#a0a0a0" font-size="11.5" font-weight="400" text-anchor="middle" >Jev's predicted pass probability (bin average)</text>
<text x="20" y="215.0" fill="#a0a0a0" font-size="11.5" font-weight="400" text-anchor="middle" transform="rotate(-90 20 215.0)">share that actually passed</text>
</svg>