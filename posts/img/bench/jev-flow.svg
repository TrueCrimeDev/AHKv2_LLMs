<text x="490" y="112" fill="#f0f0f0" font-size="20" font-weight="600" text-anchor="start" >0.42</text>
<rect x="556" y="102" width="150" height="10" rx="3" fill="#262626"/><rect x="556" y="102" width="63.0" height="10" rx="3" fill="#d95926"/>
<text x="490" y="136" fill="#707070" font-size="10.5" font-weight="400" text-anchor="start" >"will the click run clean?" → probably not</text>
<rect x="476" y="156" width="260" height="108" rx="8" fill="#1a1a1a" stroke="#303030"/>
<text x="490" y="176" fill="#a0a0a0" font-size="11" font-weight="600" text-anchor="start" >choice · defect</text>
<text x="490" y="197" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >unbound_this</text>
<rect x="606" y="190" width="80" height="8" rx="3" fill="#262626"/><rect x="606" y="190" width="58.4" height="8" rx="3" fill="#199e70"/>
<text x="692" y="197" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.73</text>
<text x="490" y="215" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >none</text>
<rect x="606" y="208" width="80" height="8" rx="3" fill="#262626"/><rect x="606" y="208" width="12.0" height="8" rx="3" fill="#4a4a4a"/>
<text x="692" y="215" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.15</text>
<text x="490" y="233" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >missing_persistent</text>
<rect x="606" y="226" width="80" height="8" rx="3" fill="#262626"/><rect x="606" y="226" width="8.0" height="8" rx="3" fill="#4a4a4a"/>
<text x="692" y="233" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.10</text>
<text x="490" y="251" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >v1_syntax</text>
<rect x="606" y="244" width="80" height="8" rx="3" fill="#262626"/><rect x="606" y="244" width="1.6" height="8" rx="3" fill="#4a4a4a"/>
<text x="692" y="251" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.02</text>
<rect x="476" y="272" width="260" height="88" rx="8" fill="#1a1a1a" stroke="#303030"/>
<text x="490" y="292" fill="#a0a0a0" font-size="11" font-weight="600" text-anchor="start" >score · quality  0.45</text>
<text x="490" y="311" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >Uses proper v2 OOP</text>
<rect x="656" y="304" width="44" height="8" rx="3" fill="#262626"/><rect x="656" y="304" width="25.1" height="8" rx="3" fill="#3987e5"/>
<text x="706" y="311" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.57</text>
<text x="490" y="328" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >Event callbacks bound correctly</text>
<rect x="656" y="321" width="44" height="8" rx="3" fill="#262626"/><rect x="656" y="321" width="18.0" height="8" rx="3" fill="#3987e5"/>
<text x="706" y="328" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.41</text>
<text x="490" y="345" fill="#d0d0d0" font-size="10.5" font-weight="400" text-anchor="start" >Has error handling</text>
<rect x="656" y="338" width="44" height="8" rx="3" fill="#262626"/><rect x="656" y="338" width="1.0" height="8" rx="3" fill="#3987e5"/>
<text x="706" y="345" fill="#a0a0a0" font-size="10.5" font-weight="400" text-anchor="start" >0.02</text>
<text x="24" y="385" fill="#707070" font-size="11" font-weight="400" text-anchor="start" >Every answer is a probability. The choice card is the one that is actually right: the callback is passed without .Bind(this).</text>
</svg>