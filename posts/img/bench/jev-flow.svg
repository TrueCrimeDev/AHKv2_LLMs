<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="DM Sans, -apple-system, Segoe UI, sans-serif">
<title id="t">How a decisions call works</title>
<desc id="d">Left: the request, a state object and three named questions. Middle: Jev. Right: three answer cards, one per question type, with the probabilities returned for the demo script.</desc>
<rect width="760" height="400" fill="#141414"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#707070"/></marker></defs>
<text x="24" y="26" fill="#f0f0f0" font-size="15" font-weight="600" text-anchor="start" >One decisions call, three question types</text>
<text x="24" y="45" fill="#a0a0a0" font-size="12" font-weight="400" text-anchor="start" >Request on the left, what came back on the right · the unbound-this demo, live from AHK v2 · $0.000022</text>
<rect x="24" y="70" width="270" height="290" rx="8" fill="#1a1a1a" stroke="#303030"/>
<text x="40" y="92" fill="#a0a0a0" font-size="11.5" font-weight="600" text-anchor="start" >POST /api/alpha/decisions</text>
<text x="40" y="114.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">{</text>
<text x="40" y="130.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">  "model": "~typesafe/jev-latest",</text>
<text x="40" y="147.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">  "state": {</text>
<text x="40" y="163.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">    "language": "AutoHotkey v2.1",</text>
<text x="40" y="180.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">    "code": "class App { ... }"</text>
<text x="40" y="196.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">  },</text>
<text x="40" y="213.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">  "questions": {</text>
<text x="40" y="229.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">    "runs_clean": { "type": "noul", ... },</text>
<text x="40" y="246.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">    "defect":     { "type": "choice",</text>
<text x="40" y="262.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">                    "criteria": {4 labels} },</text>
<text x="40" y="279.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">    "quality":    { "type": "score",</text>
<text x="40" y="295.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">                    "criteria": [3 items] }</text>
<text x="40" y="312.0" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">  }</text>
<text x="40" y="328.5" fill="#d0d0d0" font-size="11.5" font-weight="400" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace" xml:space="preserve">}</text>
<line x1="300" y1="215" x2="340" y2="215" stroke="#707070" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="344" y="190" width="82" height="50" rx="25" fill="#3987e5"/>
<text x="385" y="211" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle" >Jev</text>
<text x="385" y="228" fill="#dbe9fb" font-size="10" font-weight="400" text-anchor="middle" >no text out</text>
<line x1="432" y1="215" x2="470" y2="215" stroke="#707070" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="476" y="70" width="260" height="78" rx="8" fill="#1a1a1a" stroke="#303030"/>
