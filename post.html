  <!-- syntax colors defined in style.css to match VS Code Dark+ -->
  <style>
    .article-container {
      width: 100%;
      max-width: 784px;
      margin: 0 auto;
      padding: 48px 32px 80px;
      flex: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .back-link:hover { color: var(--text-primary); }

    .article-header {
      margin-bottom: 40px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .article-header .eyebrow { margin-bottom: 18px; min-height: 18px; }

    .article-title {
      margin: 0;
      font-size: clamp(30px, 3.8vw, 42px);
      font-weight: 730;
      line-height: 1.1;
      letter-spacing: -1.6px;
      text-wrap: balance;
    }

    .title-skeleton {
      display: block;
      width: 72%;
      height: 0.8em;
      margin: 0.12em 0;
      border-radius: 6px;
      background: var(--bg-elevated);
    }
    .title-skeleton + .title-skeleton { width: 44%; }

    .article-lede {
      margin: 20px 0 0;
      max-width: 640px;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .article-lede:empty { display: none; }

    .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 24px;
    }
    .article-tags:empty { display: none; }

    .article-body {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text-body);
    }

    /* The markdown repeats the title as its first line; the header already shows it. */
    .article-body > h1:first-child { display: none; }

    .article-body h1,
    .article-body h2,
    .article-body h3,
    .article-body h4 {
      color: var(--text-primary);
      line-height: 1.3;
    }

    .article-body h2 {
      margin: 48px 0 16px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 24px;
      font-weight: 680;
      letter-spacing: -0.6px;
    }

    .article-body h3 { margin: 32px 0 10px; font-size: 19px; font-weight: 650; letter-spacing: -0.4px; }
    .article-body h4 { margin: 24px 0 8px; font-size: 16px; font-weight: 650; }

    .article-body p { margin: 0 0 18px; }

    .article-body ul, .article-body ol { margin: 0 0 18px; padding-left: 1.4em; }
    .article-body li { margin: 6px 0; }
    .article-body li::marker { color: var(--text-muted); }

    .article-body strong { color: var(--text-primary); font-weight: 650; }

    .article-body a {
      color: var(--text-primary);
      text-decoration: underline;
      text-decoration-color: #5f5f5f;
      text-underline-offset: 3px;
      transition: color 0.15s, text-decoration-color 0.15s;
    }
    .article-body a:hover { color: #ffffff; text-decoration-color: var(--accent); }

    .article-body blockquote {
      margin: 24px 0;
      padding: 2px 0 2px 18px;
      border-left: 2px solid var(--accent);
      color: var(--text-secondary);
    }

    .article-body hr { border: 0; border-top: 1px solid var(--border); margin: 40px 0; }
    .article-body img { max-width: 100%; height: auto; }

    .article-body pre {
      margin: 24px 0;
      padding: 18px 20px;
      overflow-x: auto;
      max-width: 100%;
    }

    .article-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .article-body table:not(.bm-heat):not(.xb-tests) { border-collapse: collapse; margin: 20px 0; font-size: 14px; }
    .article-body table:not(.bm-heat):not(.xb-tests) th {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .article-body table:not(.bm-heat):not(.xb-tests) td { padding: 8px 12px; border-bottom: 1px solid var(--border-muted); }

    .article-body code { font-size: 0.86em; overflow-wrap: anywhere; }

    .article-body pre code {
      font-size: 13.5px;
      line-height: 1.65;
      overflow-wrap: normal;
    }

    /* Italic closing disclosure line */
    .article-body > p:last-child:has(> em:only-child) {

      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text-muted);
    }
    .article-body > p:last-child:has(> em:only-child) em { color: inherit; }

    /* clipboard-benchmark diagrams */
    .bm-wrap{margin:22px 0;}
    .bm-h{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#707070;font-weight:600;margin:0 0 10px;}
    .bm-funnel{display:flex;flex-direction:column;gap:7px;}
    .bm-frow{display:flex;align-items:center;gap:12px;}
    .bm-fbar{height:38px;border-radius:7px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
    .bm-fmeta{font-size:12.5px;color:#9a9a9a;}
    .bm-fmeta b{color:#d6d6d6;font-weight:600;}
    .bm-bars{display:flex;flex-direction:column;gap:9px;}
    .bm-brow{display:grid;grid-template-columns:172px 1fr 34px;align-items:center;gap:12px;font-size:13px;}
    .bm-blabel{color:#c4c4c4;text-align:right;}
    .bm-btrack{background:#1c1c1c;border-radius:5px;height:20px;overflow:hidden;border:1px solid #262626;}
    .bm-bfill{height:100%;border-radius:5px;}
    .bm-bval{color:#fff;font-variant-numeric:tabular-nums;font-weight:600;}
    .bm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;}
    .bm-card{background:#121212;border:1px solid #2c2c2c;border-radius:12px;padding:14px 15px;border-top:3px solid #444;}
    .bm-card h4{margin:0 0 2px;font-size:15px;color:#fff;}
    .bm-card .prov{font-size:11px;color:#6f6f6f;margin-bottom:10px;}
    .bm-stat{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #1d1d1d;}
    .bm-stat:last-of-type{border-bottom:none;}
    .bm-stat .k{color:#9a9a9a;}.bm-stat .v{color:#fff;font-weight:600;}
    .bm-verdict{margin-top:9px;font-size:12px;line-height:1.5;color:#b6b6b6;border-top:1px solid #2c2c2c;padding-top:8px;}
    .bm-flow{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;margin:6px 0;}
    .bm-fb{flex:1;min-width:120px;background:#161616;border:1px solid #2c2c2c;border-radius:9px;padding:11px 13px;font-size:12.5px;color:#d2d2d2;}
    .bm-fb b{color:#fff;display:block;font-size:13.5px;margin-bottom:2px;}
    .bm-arrow{display:flex;align-items:center;color:#5a5a5a;font-size:20px;padding:0 8px;}
    .bm-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:680px){.bm-split{grid-template-columns:1fr;}}
    .bm-good{border-left:3px solid #7BC96F;}.bm-bad{border-left:3px solid #DC3545;}
    .bm-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;}
    .bm-tag.run{background:rgba(123,201,111,.14);color:#7BC96F;}
    .bm-tag.crash{background:rgba(220,53,69,.14);color:#e0727d;}
    .bm-heat{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
    .bm-heat th{background:#161616;color:#808080;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:8px 6px;border-bottom:1px solid #303030;}
    .bm-heat td{padding:5px 7px;text-align:center;border-bottom:1px solid #1a1a1a;font-variant-numeric:tabular-nums;}
    .bm-heat .h-rank{color:#6f6f6f;}.bm-heat .h-name{text-align:left;}
    .bm-heat .h-name a{color:#d6d6d6;text-decoration:none;}.bm-heat .h-name a:hover{color:#5B9FEF;}
    .bm-heat tbody tr:hover td{background:#161616;}
    .h-emer{background:rgba(123,201,111,.16);color:#aee0a3;font-weight:600;}
    .h-blue{background:rgba(91,159,239,.15);color:#a9cdf5;font-weight:600;}
    .h-amber{background:rgba(245,158,66,.15);color:#f0c48a;font-weight:600;}
    .h-red{background:rgba(220,53,69,.13);color:#e3969d;font-weight:600;}
    .h-dim{color:#5a5a5a;}
    .bm-cta{display:inline-block;margin:4px 0 2px;padding:9px 16px;background:#5B9FEF;color:#0b0b0b;font-weight:600;font-size:13.5px;border-radius:8px;text-decoration:none;}
    .bm-cta:hover{background:#4d8fe0;}
    .fbchips{display:flex;flex-wrap:wrap;gap:8px;}
    .fbchip{display:inline-flex;flex-direction:column;background:#121212;border:1px solid #2c2c2c;border-left:3px solid #7BC96F;border-radius:8px;padding:7px 11px;font-size:12.5px;}
    .fbchip a{color:#fff;font-weight:600;text-decoration:none;}.fbchip a:hover{color:#5B9FEF;}
    .fbchip .fbwas{color:#7f7f7f;font-size:10.5px;margin-top:1px;}
    .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
    .gcard{background:#121212;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;text-decoration:none;display:block;transition:transform .15s,border-color .15s,box-shadow .15s;}
    .gcard:hover{border-color:#5B9FEF;transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.45);}
    .gshot{padding:10px 10px 0;}
    .gshot img{width:100%;height:150px;object-fit:cover;object-position:top left;display:block;background:#0d0d0d;border:1px solid #232323;border-radius:8px;}
    .gcap{display:flex;justify-content:space-between;align-items:center;padding:11px 13px 13px;}
    .gname{font-size:13.5px;color:#e6e6e6;font-weight:600;}.gv{font-size:11.5px;font-weight:600;}

    @media (max-width: 680px) {

  <script>
    const SITE = 'AHKv2 & LLMs';
    const slug = new URLSearchParams(window.location.search).get('slug');
    const byId = id => document.getElementById(id);

    // posts.json dates are calendar dates; new Date('YYYY-MM-DD') reads them as UTC midnight
    // and shows the previous day west of Greenwich.
    function parseDate(s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
    }

    async function fetchManifest() {
      const response = await fetch('posts/posts.json');
      if (!response.ok) throw new Error('Manifest missing (' + response.status + ')');
      return response.json();
    }

    function applyMetadata(meta) {
      byId('article-title').textContent = meta.title;
      document.title = meta.title + ' - ' + SITE;
      if (meta.date) {
        byId('article-date').textContent = parseDate(meta.date)
          .toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      }
      byId('article-lede').textContent = meta.preview || '';
      const tags = byId('article-tags');
      tags.textContent = '';
      (meta.tags || []).forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = t;
        tags.appendChild(span);
      });
    }

    function addReadingTime() {
      const words = (byId('content').innerText || '').split(/\s+/).filter(Boolean).length;
      if (words < 120) return;
      byId('article-date').textContent += ' · ' + Math.max(1, Math.round(words / 230)) + ' min read';
    }

    function showMissing(message) {
      byId('article-title').textContent = 'Post not found';
      document.title = 'Post not found - ' + SITE;
      byId('article-date').textContent = slug ? slug : 'No post specified';
      byId('article-lede').textContent = message;
      const content = byId('content');
      content.removeAttribute('aria-busy');
      content.innerHTML = '<p class="post-missing"><a href="index.html#posts">Browse all posts</a></p>';
    }

    async function renderPost(meta) {
      const response = await fetch(meta.path);
      if (!response.ok) throw new Error('The post file is missing (' + response.status + ').');
      const markdown = await response.text();

      marked.use(markedHighlight.markedHighlight({
        langPrefix: 'hljs language-',
        highlight: function(code, lang) {
          // Map cpp/ahk fences to the ahk2 grammar; untagged blocks default to ahk2 too.
          const mapped = (lang === 'cpp' || lang === 'ahk') ? 'ahk2' : lang;
          if (mapped && hljs.getLanguage(mapped)) {
            return hljs.highlight(code, { language: mapped }).value;
          }
          return hljs.highlight(code, { language: 'ahk2' }).value;
        }
      }));
      marked.setOptions({ breaks: true, gfm: true });

      const content = byId('content');
      content.innerHTML = marked.parse(markdown);
      content.removeAttribute('aria-busy');
      addReadingTime();
    }

    async function init() {
      if (!slug) {
        showMissing('This page needs a ?slug= parameter naming a post.');
        return;
      }
      let meta;
      try {
        const manifest = await fetchManifest();
        meta = manifest.find(entry => entry.slug === slug);
      } catch (error) {
        console.error(error);
        showMissing('The post index failed to load. Try again in a moment.');
        return;
      }
      if (!meta) {
        showMissing('No post with this name is in the index. It may not be published yet, or the link may be mistyped.');
        return;
      }
      applyMetadata(meta);
      try {
        await renderPost(meta);
      } catch (error) {
        console.error(error);
        const content = byId('content');
        content.removeAttribute('aria-busy');
        content.innerHTML = '<p class="post-missing">' + error.message + ' <a href="index.html#posts">Browse all posts</a></p>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
